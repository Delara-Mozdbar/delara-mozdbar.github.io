<title>Delara Mozdbar has moved to delara.work</title>
<meta name="description" content="Delara Mozdbar's portfolio has moved to delara.work.">
<link rel="canonical" href="https://delara.work/">

<style>
  :root {
    --ink: #0e0e11;
    --navy: #0b1a4f;
    --blue: #2d52d6;
    --gold: #f0b429;
    --text: #f4f6ff;
    --muted: #aab4d8;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    overflow: hidden;
    transition: background-color 3.2s ease;
  }
  body.blue { background: var(--navy); }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 1.6rem; }
  .notebook { width: min(56vw, 250px); height: auto; opacity: 0; transform: translateY(14px) rotate(-3deg);
    transition: opacity .7s ease, transform .9s ease; filter: drop-shadow(0 24px 40px rgba(0,0,0,.55)); }
  .notebook.in { opacity: 1; transform: none; }
  #brush { opacity: 0; transition: opacity .3s; }
  .msg { text-align: center; max-width: 360px; opacity: 0; transition: opacity .8s ease; }
  .msg.in { opacity: 1; }
  h1 { font-size: 1.2rem; margin: 0 0 .3rem; font-weight: 700; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
  .bar { height: 5px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; margin: 1.1rem auto 0; width: min(70vw, 280px); }
  .bar span { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 99px; }
  .msg.in .bar span { animation: fill 5s linear forwards; }
  @keyframes fill { to { width: 100%; } }
  .skip { position: fixed; top: 16px; right: 16px; z-index: 5; border: 1px solid rgba(255,255,255,.25);
    color: var(--text); padding: .5rem .9rem; border-radius: 99px; font-size: .85rem; text-decoration: none; }
  .skip:hover { border-color: var(--gold); }
  .skip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .notebook, .msg, body { transition: none; }
    .msg.in .bar span { animation-duration: 2s; }
  }
</style>
</head>
<body>

  </div>
</div>

<script>
(function () {
  var TARGET = "https://delara.work/";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var nb = document.getElementById("nb"), msg = document.getElementById("msg");
  var brush = document.getElementById("brush"), shape = document.getElementById("brushShape");
  var paint = document.getElementById("paint");
  var len = paint.getTotalLength();
  paint.style.strokeDasharray = len;
  paint.style.strokeDashoffset = reduce ? 0 : len;

  function go() { window.location.replace(TARGET); }

  if (reduce) {
    document.getElementById("oldBook").style.display = "none";
    document.body.classList.add("blue");
    nb.classList.add("in"); msg.classList.add("in");
    setTimeout(go, 2500);
    return;
  }

  setTimeout(function () { nb.classList.add("in"); }, 100);
  setTimeout(function () { msg.classList.add("in"); }, 500);

  var PAINT_START = 1500, PAINT_MS = 3200;
  setTimeout(function () {
    brush.style.opacity = 1;
    document.body.classList.add("blue");
    var t0 = null;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min((ts - t0) / PAINT_MS, 1);
      var d = k * len;
      paint.style.strokeDashoffset = len - d;
      var pt = paint.getPointAtLength(d);
      var wiggle = Math.sin(k * 40) * 2;
      shape.setAttribute("transform", "translate(" + pt.x + "," + pt.y + ") rotate(" + (28 + wiggle) + ")");
      if (k < 1) requestAnimationFrame(step);
      else { brush.style.transition = "opacity .5s"; brush.style.opacity = 0; }
    }
    requestAnimationFrame(step);
  }, PAINT_START);

  setTimeout(go, 6200);
})();
</script>
